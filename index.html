<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딸기 봄바나나</title>
<style>
  :root { --bg: #fff6f8; --ink: #3a2a2e; --accent: #e84a6a; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 1.4rem; margin: 12px 0 4px; }
  #info { margin-bottom: 8px; }
  canvas { background: linear-gradient(#cdeffd, #fdfbe8); border-radius: 12px;
           max-width: calc(100vw - 32px); touch-action: none; }
  button { margin: 10px; padding: 10px 24px; font-size: 1rem; border: 0;
           border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<h1>🍓 딸기 봄바나나 🍌</h1>
<div id="info">점수: <b id="score">0</b> · 목숨: <b id="lives">❤️❤️❤️</b></div>
<canvas id="game" width="400" height="560"></canvas>
<button id="start">시작하기</button>
<p>← → 키나 손가락으로 바구니를 움직여서 딸기와 바나나를 받아요. 💣은 피하세요!</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const startBtn = document.getElementById('start');

// 떨어지는 물건 종류: 이모지, 점수, 나올 확률
const KINDS = [
  { emoji: '🍓', points: 1, chance: 0.5 },
  { emoji: '🍌', points: 2, chance: 0.35 },
  { emoji: '💣', points: 0, chance: 0.15 },
];

let basket, items, score, lives, running, spawnTimer, speed, keys = {};

function reset() {
  basket = { x: W / 2, y: H - 40, w: 70 };
  items = [];
  score = 0; lives = 3; speed = 2; spawnTimer = 0;
  updateHud();
}

function updateHud() {
  scoreEl.textContent = score;
  livesEl.textContent = '❤️'.repeat(lives) || '💔';
}

function pickKind() {
  let r = Math.random();
  for (const k of KINDS) { if ((r -= k.chance) < 0) return k; }
  return KINDS[0];
}

function spawn() {
  items.push({ kind: pickKind(), x: 20 + Math.random() * (W - 40), y: -20, vy: speed + Math.random() });
}

function update() {
  if (keys.ArrowLeft) basket.x -= 7;
  if (keys.ArrowRight) basket.x += 7;
  basket.x = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.x));

  if (--spawnTimer <= 0) { spawn(); spawnTimer = Math.max(20, 60 - score); }
  speed = 2 + score / 20;

  for (const it of items) {
    it.y += it.vy;
    const caught = it.y > basket.y - 20 && it.y < basket.y + 10 &&
                   Math.abs(it.x - basket.x) < basket.w / 2;
    if (caught) {
      it.done = true;
      if (it.kind.emoji === '💣') lives--; else score += it.kind.points;
    } else if (it.y > H + 20) {
      it.done = true;
      if (it.kind.emoji === '🍓') lives--; // 딸기를 놓치면 목숨이 줄어요
    }
  }
  items = items.filter(it => !it.done);
  updateHud();
  if (lives <= 0) gameOver();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.font = '32px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const it of items) ctx.fillText(it.kind.emoji, it.x, it.y);
  ctx.font = '48px serif';
  ctx.fillText('🧺', basket.x, basket.y);
}

function loop() {
  if (!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  draw();
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillRect(0, H / 2 - 60, W, 120);
  ctx.fillStyle = '#3a2a2e';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('게임 끝!', W / 2, H / 2 - 15);
  ctx.font = '20px sans-serif';
  ctx.fillText('점수: ' + score, W / 2, H / 2 + 20);
  startBtn.textContent = '다시 하기';
  startBtn.style.display = '';
}

startBtn.onclick = () => {
  reset();
  running = true;
  startBtn.style.display = 'none';
  loop();
};

addEventListener('keydown', e => { keys[e.key] = true; });
addEventListener('keyup', e => { keys[e.key] = false; });

function moveTo(clientX) {
  const rect = canvas.getBoundingClientRect();
  basket.x = (clientX - rect.left) * (W / rect.width);
}
canvas.addEventListener('pointermove', e => { if (running) moveTo(e.clientX); });
canvas.addEventListener('pointerdown', e => { if (running) moveTo(e.clientX); });

reset();
draw();
</script>
</body>
</html>
