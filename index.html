<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>딸기 봄바나나</title>
<style>
  :root { --bg: #fff8ec; --ink: #3a2a1e; --card: #ffffff; --line: #e8d9c0; --accent: #e8a317; --bad: #d64545; --good: #2f9e44; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
  h1 { font-size: 1.4rem; text-align: center; margin: 8px 0; }
  .hud { display: flex; justify-content: space-between; font-weight: bold; margin: 8px 0; }
  .tabs { display: flex; gap: 6px; margin: 8px 0 12px; }
  .tabs button { flex: 1; padding: 10px 4px; border: 2px solid var(--line); background: var(--card);
                 border-radius: 12px; font-size: 0.95rem; cursor: pointer; color: var(--ink); }
  .tabs button.on { border-color: var(--accent); background: #fff1cf; font-weight: bold; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px; }
  .hint { font-size: 0.9rem; color: #7a6650; margin: 0 0 10px; }
  .wire { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px dashed var(--line); }
  .wire:last-child { border-bottom: 0; }
  .pos { width: 52px; font-size: 0.85rem; color: #7a6650; }
  .bar { flex: 1; height: 14px; border-radius: 7px; border: 1px solid #0003; }
  .bar.cut { background: repeating-linear-gradient(90deg, currentColor 0 40%, transparent 40% 60%, currentColor 60%) !important; opacity: .4; }
  .num { width: 64px; text-align: center; font-size: 1.3rem; font-weight: bold; }
  .braille { font-size: 2rem; letter-spacing: 2px; line-height: 1; }
  .cutbtn { padding: 8px 12px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; cursor: pointer; }
  .cutbtn:disabled { opacity: .3; cursor: default; }
  .manual ol { padding-left: 20px; line-height: 1.7; }
  .chart { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 12px; text-align: center; font-size: 0.85rem; }
  .chart div { border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
  .chart .braille { font-size: 1.5rem; }
  .msg { text-align: center; font-weight: bold; min-height: 1.6em; margin: 10px 0; }
  .msg.bad { color: var(--bad); } .msg.good { color: var(--good); }
  .big { display: block; margin: 12px auto; padding: 12px 28px; border: 0; border-radius: 999px;
         background: var(--accent); color: #fff; font-size: 1.05rem; cursor: pointer; }
  .roles { font-size: 0.9rem; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>🐵 딸기 봄바나나 💣</h1>
  <div class="hud">
    <span>폭탄 <span id="round">1</span> / 3</span>
    <span>⏱ <span id="time">3:00</span></span>
    <span>실수 <span id="strikes">⚪⚪⚪</span></span>
  </div>
  <div class="tabs" id="tabs">
    <button data-role="mute">🙊 설명서</button>
    <button data-role="deaf">🙉 폭탄 보기</button>
    <button data-role="blind">🙈 폭탄 해체</button>
  </div>
  <div class="card" id="view"></div>
  <div class="msg" id="msg"></div>
  <button class="big" id="startBtn">게임 시작</button>
  <div class="card roles" id="intro">
    <b>연습판</b>이에요. 한 기기에서 위 버튼으로 화면을 바꿔 가며 해 보세요.<br>
    🙊 <b>말을 못 하는 원숭이</b>: 설명서만 볼 수 있어요. 말은 못 하고 손가락과 고개로만 알려 줘요.<br>
    🙉 <b>귀가 안 들리는 원숭이</b>: 폭탄 모습을 볼 수 있어요. 다른 친구 말은 못 들어요.<br>
    🙈 <b>눈이 안 보이는 원숭이</b>: 색을 볼 수 없고 숫자는 점자로만 보여요. 이 친구만 선을 자를 수 있어요.
  </div>
</main>

<script>
// ===== 게임 데이터 =====
const COLORS = {
  red:    { name: '빨강', css: '#e03131' },
  blue:   { name: '파랑', css: '#1c7ed6' },
  yellow: { name: '노랑', css: '#fcc419' },
  white:  { name: '하양', css: '#f8f9fa' },
  black:  { name: '검정', css: '#212529' },
};
const COLOR_KEYS = Object.keys(COLORS);
// 점자 숫자: 수표(⠼) 다음에 숫자 점형
const BRAILLE_DIGITS = { 1: '⠁', 2: '⠃', 3: '⠉', 4: '⠙', 5: '⠑', 6: '⠋', 7: '⠛', 8: '⠓', 9: '⠊' };
const braille = n => '⠼' + BRAILLE_DIGITS[n];

const MANUAL = [
  '빨간 선이 하나도 없으면 → <b>두 번째</b> 선을 자르세요.',
  '맨 마지막 선이 하양이면 → <b>마지막</b> 선을 자르세요.',
  '파란 선이 2개 이상이면 → <b>마지막 파란 선</b>을 자르세요.',
  '그 밖의 경우 → <b>첫 번째</b> 선을 자르세요.',
];
const TOTAL_ROUNDS = 3, MAX_STRIKES = 3, TIME_LIMIT = 180;

// ===== 게임 상태 (나중에 Supabase로 세 기기에 똑같이 나눠 줄 부분) =====
let state = null;
let role = 'mute';
let timerId = null;

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function makeBomb() {
  const count = 3 + Math.floor(Math.random() * 4); // 선 3~6개
  const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5);
  const wires = [];
  for (let i = 0; i < count; i++) wires.push({ color: pick(COLOR_KEYS), num: nums[i], cut: false });
  return { wires, answer: solve(wires) };
}

// 설명서 규칙대로 잘라야 할 선의 위치(0부터)
function solve(wires) {
  const colors = wires.map(w => w.color);
  if (!colors.includes('red')) return 1;
  if (colors[colors.length - 1] === 'white') return wires.length - 1;
  if (colors.filter(c => c === 'blue').length >= 2) return colors.lastIndexOf('blue');
  return 0;
}

function startGame() {
  state = { round: 1, strikes: 0, timeLeft: TIME_LIMIT, bomb: makeBomb(), over: false };
  document.getElementById('intro').style.display = 'none';
  document.getElementById('startBtn').style.display = 'none';
  setMsg('');
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  render();
}

function tick() {
  if (state.over) return;
  state.timeLeft--;
  if (state.timeLeft <= 0) endGame(false, '시간이 다 됐어요! 💥 펑!');
  render();
}

function cutWire(i) {
  if (!state || state.over) return;
  const w = state.bomb.wires[i];
  if (w.cut) return;
  w.cut = true;
  if (i === state.bomb.answer) {
    if (state.round === TOTAL_ROUNDS) return endGame(true, '폭탄 3개를 모두 해체했어요! 🎉 최고의 팀이에요!');
    state.round++;
    state.bomb = makeBomb();
    setMsg('성공! 다음 폭탄이에요. 🍌', 'good');
  } else {
    state.strikes++;
    if (state.strikes >= MAX_STRIKES) return endGame(false, '실수 3번! 💥 펑! 다시 해 봐요.');
    setMsg('앗, 틀린 선이에요! 다시 이야기해 봐요.', 'bad');
  }
  render();
}

function endGame(win, text) {
  state.over = true;
  clearInterval(timerId);
  setMsg(text, win ? 'good' : 'bad');
  const btn = document.getElementById('startBtn');
  btn.textContent = '다시 하기';
  btn.style.display = '';
  render();
}

function setMsg(text, kind) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (kind || '');
}

// ===== 화면 그리기 =====
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.role === role));
  const view = document.getElementById('view');
  if (!state) { view.innerHTML = '<p class="hint">게임 시작을 누르면 폭탄이 나타나요.</p>'; return; }

  document.getElementById('round').textContent = state.round;
  const t = Math.max(0, state.timeLeft);
  document.getElementById('time').textContent = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  document.getElementById('strikes').textContent = '❌'.repeat(state.strikes) + '⚪'.repeat(MAX_STRIKES - state.strikes);

  const wires = state.bomb.wires;
  if (role === 'mute') {
    view.innerHTML = `
      <div class="manual">
        <p class="hint">🙊 말은 못 해요. 손가락 숫자와 고개 방향으로만 알려 주세요.</p>
        <b>📖 폭탄 해체 설명서</b> (위에서부터 차례로 확인)
        <ol>${MANUAL.map(r => `<li>${r}</li>`).join('')}</ol>
        <p class="hint">선의 순서는 위에서부터 첫 번째, 두 번째… 로 세요.</p>
      </div>`;
  } else if (role === 'deaf') {
    view.innerHTML = `
      <p class="hint">🙉 친구들 말은 들리지 않아요. 폭탄 모습을 말로 설명하고, 🙊 친구의 손짓을 잘 보세요.</p>
      ${wires.map((w, i) => `
        <div class="wire">
          <span class="pos">${i + 1}번째</span>
          <span class="bar ${w.cut ? 'cut' : ''}" style="background:${COLORS[w.color].css};color:${COLORS[w.color].css}"></span>
          <span class="num">${w.num}</span>
        </div>`).join('')}`;
  } else {
    view.innerHTML = `
      <p class="hint">🙈 색은 보이지 않아요. 숫자는 점자예요. 🙉 친구가 알려 주는 숫자의 선을 찾아 자르세요.</p>
      ${wires.map((w, i) => `
        <div class="wire">
          <span class="bar ${w.cut ? 'cut' : ''}" style="background:#adb5bd;color:#adb5bd"></span>
          <span class="num braille">${braille(w.num)}</span>
          <button class="cutbtn" data-i="${i}" ${w.cut || state.over ? 'disabled' : ''}>✂️ 자르기</button>
        </div>`).join('')}
      <div class="chart">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<div><span class="braille">${braille(n)}</span><br>${n}</div>`).join('')}
      </div>`;
    view.querySelectorAll('.cutbtn').forEach(b => b.onclick = () => cutWire(+b.dataset.i));
  }
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { role = b.dataset.role; render(); });
document.getElementById('startBtn').onclick = startGame;
render();
</script>
</body>
</html>
